services:
  postgres:
    image: postgres:16-alpine
    container_name: callface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: callface_crm
      POSTGRES_USER: callface
      POSTGRES_PASSWORD: callface2026dev
    ports:
      - "5433:5432"
    volumes:
      - pg_data_callface:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callface -d callface_crm"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callface-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data_callface:
