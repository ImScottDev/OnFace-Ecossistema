services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mcrm-production
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=384
      - DB_POOL_SIZE=15
    volumes:
      - ./uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      # Frontend: all routes EXCEPT /api/* (but /api/auth stays here for NextAuth)
      - "traefik.http.routers.mcrm.rule=Host(`crm.scottstudio.com.br`) && (!PathPrefix(`/api`) || PathPrefix(`/api/auth`))"
      - "traefik.http.routers.mcrm.entrypoints=websecure"
      - "traefik.http.routers.mcrm.tls.certresolver=cloudflare"
      - "traefik.http.routers.mcrm.middlewares=security-headers@file"
      - "traefik.http.services.mcrm.loadbalancer.server.port=3000"
    networks:
      - proxy-network
      - database-network
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=10", "http://127.0.0.1:3000/api/auth/session"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./app
      dockerfile: Dockerfile.api
    container_name: mcrm-api
    restart: unless-stopped
    env_file: .env
    environment:
      - API_PORT=3001
      - NODE_OPTIONS=--max-old-space-size=256
    volumes:
      - ./uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      # API: /api/* routes EXCEPT /api/auth (NextAuth stays on Next.js)
      - "traefik.http.routers.mcrm-api.rule=Host(`crm.scottstudio.com.br`) && PathPrefix(`/api`) && !PathPrefix(`/api/auth`)"
      - "traefik.http.routers.mcrm-api.entrypoints=websecure"
      - "traefik.http.routers.mcrm-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.mcrm-api.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.routers.mcrm-api.priority=100"
      - "traefik.http.services.mcrm-api.loadbalancer.server.port=3001"
      - "traefik.http.services.mcrm-api.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.mcrm-api.loadbalancer.healthcheck.interval=10s"
    networks:
      - proxy-network
      - database-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile.worker
    container_name: mcrm-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - database-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /dev/shm:size=256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  proxy-network:
    external: true
    name: proxy-network
  database-network:
    external: true
    name: database-network
