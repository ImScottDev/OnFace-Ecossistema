# ONFACE — ambiente publicado de desenvolvimento (dev.crm.callface.io).
#
# É o compose que roda em /opt/callface/crm2-dev, enviado pelo ./deploy.sh.
# Segredos vêm só do .env do servidor (env_file), nunca deste arquivo.
#
# Isolado de produção de propósito:
#   - todos os containers usam o prefixo callface-${STACK:-crm2-dev}-
#   - rede propria crm2dev-network, NAO usa database-network (onde vive o banco de produção)
#   - volumes proprios
#   - wuzapi proprio, com WHATSAPP_ALLOWLIST travando a saida no numero do Kaua
#
# Mesmo arquivo para produção (crm2-dev) e homologação (crm2-homolog): o que muda
# é só o .env do servidor (STACK, ROTA, REDE, PG_PORTA, CRM_DOMAIN). Sem essas
# variáveis valem os padrões abaixo, que são os da produção. Ver docs/operacao/homologacao.md.
# Subir:  docker compose -p crm2-dev up -d
# Imagens: construidas no GitHub Actions (GHCR); a EC2 so faz pull. Ver deploy.sh.

# Rotação de log: sem isto o driver json-file cresce sem teto e enche o disco da
# caixa — em 14/10/2026 ela estava com 4,7 GB livres de 96 GB. E, pior, o log vive
# só dentro do container: o deploy recria os três e leva o histórico junto, então
# "o que quebrou ontem" vira pergunta sem resposta.
x-log: &log
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *log
    container_name: callface-${STACK:-crm2-dev}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: callface_crm
      POSTGRES_USER: callface
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Somente 127.0.0.1: permite tunel SSH para migration e debug, sem expor o banco na internet.
    ports:
      - "127.0.0.1:${PG_PORTA:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - crm2dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callface -d callface_crm"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    logging: *log
    container_name: callface-${STACK:-crm2-dev}-redis
    restart: unless-stopped
    # AOF (everysec) já garante a fila; o snapshot RDB em cima dele era
    # escrita redundante — este Redis respondia por 96 GB de escrita em disco,
    # mais que todo o resto da máquina somado, com um dataset de ~1.600 chaves.
    # "--save ''" desliga só o snapshot, a durabilidade do AOF continua.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    networks:
      - crm2dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  wuzapi:
    # Versão fixa, não `latest`: um `up` futuro trocaria a imagem sem aviso, e
    # o WhatsApp já caiu inteiro antes por "ClientOutdated" quando o whatsmeow
    # de dentro dela ficou velho. Subir de versão passa a ser decisão, testada
    # em dev antes. Fixado por DIGEST: a tag `v1.0.9` que estava aqui não existe
    # no Docker Hub (13/10/2026), e o que roda é a `latest` de 17/09/2026.
    # 30/10/2026: as sessões do WhatsApp vieram do wuzapi do CRM legado, que roda
    # 1.0.8. Esta é a MESMA imagem: subir 1.0.9 por cima rodaria migração de schema
    # no banco de sessões, e sessão perdida significa reparear no celular.
    image: asternic/wuzapi@sha256:9849d36d8c4e336af6f3b4ce2011b471f303590922d1b4604f12cbae5487ec01
    logging: *log
    container_name: callface-${STACK:-crm2-dev}-wuzapi
    restart: unless-stopped
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_GLOBAL_HMAC_KEY}
      - DB_HOST=callface-${STACK:-crm2-dev}-postgres
      - DB_PORT=5432
      - DB_USER=callface
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=callface_wuzapi
      - TZ=America/Sao_Paulo
    networks:
      - crm2dev-network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 30/10/2026: 192M era MENOS que os 256M em que o wuzapi do legado já
          # morria de OOM (20/10 e 29/10), derrubando o WhatsApp. Com as sessões
          # migradas para cá, o pico é o mesmo: ~257MB. 512M dá a folga.
          memory: 512M

  app:
    # Imagem pronta do GHCR, construída pelo GitHub Actions na tag do commit.
    # IMAGE_TAG vem do .env do servidor, gravado pelo ./deploy.sh. O `build:`
    # fica só para o fallback `./deploy.sh producao --construir-aqui`.
    build:
      context: .
      target: app
    image: ghcr.io/imscottdev/onface-app:${IMAGE_TAG:-main}
    logging: *log
    container_name: callface-${STACK:-crm2-dev}-app
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      # Nome da conexão no Postgres: o trigger de auditoria de responsável grava quem escreveu.
      - APP_NAME=onface-app-${STACK:-dev}
      # Onde o signatário assina. Sem isso o link de assinatura cai no host interno (http://documenso:3000), que o cliente não alcança.
      - DOCUMENSO_PUBLIC_URL=${DOCUMENSO_PUBLIC_URL:-https://sign.callface.io}
      - NODE_OPTIONS=--max-old-space-size=448
      - DB_POOL_SIZE=10
    volumes:
      - ./uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      # Webhook de terceiro (Stripe, Documenso, wuzapi) entra sem basic auth, senao o 401 mata a entrega
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.rule=Host(`${CRM_DOMAIN:-dev.crm.callface.io}`) && PathPrefix(`/api/webhooks`)"
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.entrypoints=websecure"
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.tls.certresolver=cloudflare"
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.priority=200"
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.service=${ROTA:-crm2dev}-app"
      # Limite de taxa por IP de origem em /api/webhooks: a rota do site (site-lead) é pública
      # sem segredo e, sem isto, um robô cria leads sem teto. 30/s com rajada de 60 não
      # atrapalha Stripe, Meta nem Resend (que mandam poucos eventos por segundo).
      - "traefik.http.middlewares.${ROTA:-crm2dev}-webhooks-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.${ROTA:-crm2dev}-webhooks-ratelimit.ratelimit.burst=60"
      - "traefik.http.routers.${ROTA:-crm2dev}-webhooks.middlewares=${ROTA:-crm2dev}-webhooks-ratelimit"
      # Frontend: tudo que nao e /api, mais as rotas de API que vivem no Next
      #
      # O prefixo tem que ser tao ESPECIFICO quanto a rota Next que ele existe
      # para alcancar. `/api/admin` ficou aqui ate 16/10/2026 por causa de UMA
      # rota (`/api/admin/stripe-webhooks`), e engolia as 20 rotas admin do Hono
      # — view-as, organizacoes, usuarios, event-outbox — que respondiam 404 em
      # producao: a tela existia, o trafego nunca chegava nela.
      - "traefik.http.routers.${ROTA:-crm2dev}-app.rule=Host(`${CRM_DOMAIN:-dev.crm.callface.io}`) && (!PathPrefix(`/api`) || PathPrefix(`/api/auth`) || PathPrefix(`/api/financeiro`) || PathPrefix(`/api/onboarding`) || PathPrefix(`/api/campanhas`) || PathPrefix(`/api/contratos-publicos`) || PathPrefix(`/api/admin/stripe-webhooks`))"
      - "traefik.http.routers.${ROTA:-crm2dev}-app.entrypoints=websecure"
      - "traefik.http.routers.${ROTA:-crm2dev}-app.tls.certresolver=cloudflare"
      - "traefik.http.routers.${ROTA:-crm2dev}-app.middlewares=security-headers@file"
      - "traefik.http.routers.${ROTA:-crm2dev}-app.priority=50"
      - "traefik.http.services.${ROTA:-crm2dev}-app.loadbalancer.server.port=3000"
    networks:
      - proxy-network
      - crm2dev-network
      - whatsapp-network
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # 30/10/2026: a máquina tem 2 vCPU e este serviço ficava preso em 1.
          # Renderizar página é trabalho de CPU; a segunda ficava ociosa.
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=10", "http://127.0.0.1:3000/api/auth/session"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 40s

  api:
    # API e worker são a MESMA imagem (`backend`); muda só o processo.
    build:
      context: .
      target: backend
    image: ghcr.io/imscottdev/onface-backend:${IMAGE_TAG:-main}
    logging: *log
    command: ["node", "app/dist/api/index.mjs"]
    container_name: callface-${STACK:-crm2-dev}-api
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      # Nome da conexão no Postgres: o trigger de auditoria de responsável grava quem escreveu.
      - APP_NAME=onface-api-${STACK:-dev}
      # Onde o codigo grava midia (client.ts usa UPLOADS_DIR); e a pasta que o Dockerfile prepara e o volume compartilha com o app.
      - UPLOADS_DIR=/repo/app/public/uploads
      # Onde o signatário assina. Sem isso o link de assinatura cai no host interno (http://documenso:3000), que o cliente não alcança.
      - DOCUMENSO_PUBLIC_URL=${DOCUMENSO_PUBLIC_URL:-https://sign.callface.io}
      - API_PORT=3001
      - NODE_OPTIONS=--max-old-space-size=320
    volumes:
      - ./uploads:/repo/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROTA:-crm2dev}-api.rule=Host(`${CRM_DOMAIN:-dev.crm.callface.io}`) && PathPrefix(`/api`) && !PathPrefix(`/api/auth`) && !PathPrefix(`/api/webhooks`) && !PathPrefix(`/api/financeiro`) && !PathPrefix(`/api/onboarding`) && !PathPrefix(`/api/campanhas`) && !PathPrefix(`/api/contratos-publicos`) && !PathPrefix(`/api/admin/stripe-webhooks`)"
      - "traefik.http.routers.${ROTA:-crm2dev}-api.entrypoints=websecure"
      - "traefik.http.routers.${ROTA:-crm2dev}-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.${ROTA:-crm2dev}-api.middlewares=security-headers@file"
      - "traefik.http.routers.${ROTA:-crm2dev}-api.priority=100"
      - "traefik.http.services.${ROTA:-crm2dev}-api.loadbalancer.server.port=3001"
    networks:
      - proxy-network
      - crm2dev-network
      - whatsapp-network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/imscottdev/onface-backend:${IMAGE_TAG:-main}
    logging: *log
    command: ["node", "app/dist/worker/index.mjs"]
    container_name: callface-${STACK:-crm2-dev}-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      # Nome da conexão no Postgres: o trigger de auditoria de responsável grava quem escreveu.
      - APP_NAME=onface-worker-${STACK:-dev}
      # Onde o codigo grava midia (client.ts usa UPLOADS_DIR); e a pasta que o Dockerfile prepara e o volume compartilha com o app.
      - UPLOADS_DIR=/repo/app/public/uploads
      # Onde o signatário assina. Sem isso o link de assinatura cai no host interno (http://documenso:3000), que o cliente não alcança.
      - DOCUMENSO_PUBLIC_URL=${DOCUMENSO_PUBLIC_URL:-https://sign.callface.io}
      - NODE_OPTIONS=--max-old-space-size=320
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      # porta do healthcheck do worker — a mesma que o `test:` abaixo consulta
      - WORKER_HEALTH_PORT=3002
    volumes:
      - ./uploads:/repo/app/public/uploads
    networks:
      - crm2dev-network
      - whatsapp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /dev/shm:size=192m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 448M

volumes:
  pg_data:
    name: callface-${STACK:-crm2-dev}-pg-data
  redis_data:
    name: callface-${STACK:-crm2-dev}-redis-data

networks:
  proxy-network:
    external: true
    name: proxy-network
  # O wuzapi (WhatsApp) vive na pilha de produção. Homologação usa o MESMO
  # servidor, e até 19/10/2026 não o alcançava: cada pilha tem a sua rede
  # (`crm2dev-network` x `crm2homolog-network`), então toda sessão aparecia
  # "desconectada" lá e nenhuma cadência conseguia enviar. Esta rede existe só
  # para isso e o wuzapi está nela; ela NÃO expõe banco nem redis de uma pilha
  # à outra, que é o motivo de não bastar pôr as duas na mesma rede.
  whatsapp-network:
    external: true
    name: whatsapp-network
  crm2dev-network:
    name: ${REDE:-crm2dev-network}
