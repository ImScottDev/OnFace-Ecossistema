# Scripts de build de dependência: decisão explícita, senão o pnpm 11 falha o
# `pnpm install` implícito e derruba qualquer `pnpm exec` (tsc, next, lint).
# esbuild e unrs-resolver precisam do script para baixar o binário da plataforma.
# sharp e puppeteer ficam de fora: o projeto não usa nenhum dos dois em runtime
# e o postinstall do puppeteer baixa um Chromium inteiro.
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  puppeteer: false
  sharp: false
  unrs-resolver: true
