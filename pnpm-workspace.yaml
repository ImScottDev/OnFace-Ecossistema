# Workspace do OnFace.
#
# `app` é a aplicação (Next + API Hono + worker). Os pacotes sob `packages/`
# são o domínio e as integrações já extraídos do `app`, importados como
# `@onface/*` (ver `transpilePackages` em app/next.config.ts).
packages:
  - app
  - packages/domain/*
  - packages/integrations/*
  - packages/platform/*

# Herdado de app/pnpm-workspace.yaml: decisão explícita de quais dependências
# podem rodar script de build. Sem isso o pnpm 11 falha o install implícito e
# derruba qualquer `pnpm exec`.
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  puppeteer: false
  sharp: false
  unrs-resolver: true
