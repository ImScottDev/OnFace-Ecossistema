# Portão automático entre escrever código e subir.
#
# O diagnóstico da fundação registrou, em 19/09: "Não existe nenhum portão
# automático entre escrever código e subir em produção. Sem CI." O CP61 pôs o
# typecheck dentro do `npm run build`, o que cobre quem constrói. Isto cobre
# quem empurra.
#
# O QUE RODA AQUI, e por quê só isto: as 91 travas de arquitetura e o typecheck
# não precisam de banco — medido em 22/09, rodam limpos com `DATABASE_URL`
# ausente. Os outros 263 testes e os 50 smokes vão contra um banco carregado com
# dado de produção, e não existe banco assim no CI. Rodá-los aqui contra um
# banco vazio não provaria nada e acabaria em vermelho permanente, que é como
# um portão morre.
#
# Então este workflow responde uma pergunta só, e responde de verdade: **o que
# foi empurrado compila, e não fura nenhuma regra de arquitetura?** O resto
# continua sendo a bateria local (`scripts/rodar-smokes.sh`,
# `scripts/rodar-aceites.sh`), que precisa do banco real.
name: portão

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tipos-e-arquitetura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # O workspace é pnpm (`pnpm-workspace.yaml` na raiz): os `@onface/*` de
      # `packages/` só ficam resolvíveis com ele.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O mesmo comando que o `build` roda desde o CP61, e a mesma razão: o
      # portão tem que ser o comando de verdade, não uma variação dele.
      # 2,2 GB de pico medido em 05/10: com o limite padrão do Node o tsc morre
      # com "JavaScript heap out of memory", e o portão passava a pular as travas.
      - name: typecheck
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsc --noEmit

      # As travas que provam regra de arquitetura: porta canônica, isolamento de
      # tenant, idempotência sem relógio, link que não leva ao vazio, métrica com
      # definição única. Todas leem arquivo, nenhuma toca banco.
      # `always()`: typecheck vermelho não pode esconder regressão de arquitetura.
      - name: travas de arquitetura
        if: always()
        working-directory: app
        run: pnpm exec tsx --test "src/lib/arquitetura/*.test.ts"

      # O fluxo que fecha venda — proposta, contrato, condições, retomada,
      # entrega de e-mail e catálogo — provado a cada commit. São testes de
      # regra pura: leem os modelos reais e as funções de decisão, sem tocar
      # banco. Rodam em menos de 1 s, então o portão não fica mais lento.
      #
      # A lista é explícita de propósito: teste que precisa de banco NUNCA pode
      # entrar aqui, ou o portão vira vermelho permanente (ver o cabeçalho
      # deste arquivo). Para incluir um novo, confira antes que ele passa com
      # DATABASE_URL ausente.
      - name: fluxo comercial (proposta, contrato e catálogo)
        if: always()
        working-directory: app
        run: |
          pnpm exec tsx --test \
            src/lib/crm/fluxo-comercial-contrato.test.ts \
            src/lib/crm/contrato-setup.test.ts \
            src/lib/crm/contrato-variaveis.test.ts \
            src/lib/crm/condicoes-comerciais.test.ts \
            src/lib/crm/decisao-fechamento.test.ts \
            src/lib/crm/retomada-aceite.test.ts \
            src/lib/email/entrega.test.ts \
            src/lib/catalogo/sincronizar-stripe.test.ts

  # ─── Imagens de deploy (só push na main) ───────────────────────────────────
  # Até 12/10/2026 a imagem era construída NA EC2: ~48 min por deploy. Agora o
  # build roda aqui, EM PARALELO ao portão acima, e publica uma imagem
  # CANDIDATA. Só quando o portão passa ela ganha a tag do commit, que é a
  # única que o `./deploy.sh dev` aceita:
  #
  #   ghcr.io/imscottdev/onface-app:<sha>       e  :main
  #   ghcr.io/imscottdev/onface-backend:<sha>   e  :main   (API + worker)
  #
  # Portão vermelho = nenhuma tag <sha> = o deploy espera e não publica nada.
  # Tag por commit é imutável: dá o rollback (`./deploy.sh dev --versao <sha>`)
  # e permite promover a mesma imagem para produção na virada.
  construir-imagem:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        alvo: [app, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cache de camadas no próprio GitHub: mudança só de código não refaz o
      # install, só o build do Next/esbuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.alvo }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/imscottdev/onface-${{ matrix.alvo }}:candidata-${{ github.sha }}
          cache-from: type=gha,scope=onface-${{ matrix.alvo }}
          cache-to: type=gha,scope=onface-${{ matrix.alvo }},mode=max

  liberar-imagem:
    needs: [tipos-e-arquitetura, construir-imagem]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-tag sem rebuild: a imagem liberada é byte a byte a que foi testada.
      - run: |
          for alvo in app backend; do
            img=ghcr.io/imscottdev/onface-$alvo
            docker buildx imagetools create -t $img:${{ github.sha }} -t $img:main $img:candidata-${{ github.sha }}
          done
