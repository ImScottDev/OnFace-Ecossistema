name: callface-documenso

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME}
    volumes:
      - documenso_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_DB_USER} -d ${DOCUMENSO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      # A caixa de teste nunca deve ficar exposta no host. O acesso de quem
      # administra o DEV e feito por tunel temporario.
      - "127.0.0.1:8025:8025"

  documenso:
    image: ghcr.io/documenso/documenso:v2.16.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      # A interface nao e exposta diretamente. O Traefik a publica pela
      # proxy-network sob o dominio dedicado de assinaturas.
      - "127.0.0.1:3500:3000"
    environment:
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@database:5432/${DOCUMENSO_DB_NAME}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@database:5432/${DOCUMENSO_DB_NAME}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: 1025
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_FROM_NAME: Callface Contratos
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: contratos@callface.io
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DOCUMENSO_DISABLE_SIGNUP:-true}
    volumes:
      - ./certs/cert.p12:/opt/documenso/cert.p12:ro
    networks:
      - default
      - crm2dev-network
      - proxy-network

volumes:
  documenso_database:

networks:
  crm2dev-network:
    external: true
    name: ${CRM2_DEV_NETWORK:-crm2dev-network}
  proxy-network:
    external: true
    name: ${DOCUMENSO_PROXY_NETWORK:-proxy-network}
